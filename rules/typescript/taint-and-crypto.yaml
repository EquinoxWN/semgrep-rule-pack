rules:
  - id: ts-tainted-shell
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Request input reaches a shell command without a sanitizer. Use execFile() or spawn() with an
      argument array (no shell), so the value cannot add commands.
    metadata:
      category: security
      bug-class: command-injection
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
      safe-pattern: execFile("ping", ["-c", "1", host]) or spawn(program, args) without shell.
      references:
        - https://nodejs.org/api/child_process.html
    pattern-sources: &ts-request-sources
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.body
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: "$CP.spawn($CMD, $ARGS, {..., shell: true, ...})"
          - focus-metavariable: $CMD
    pattern-sanitizers: &ts-scalar-sanitizers
      - pattern: parseInt(...)
      - pattern: Number(...)
      - pattern: parseFloat(...)
      - pattern: $SQ.quote(...)

  - id: ts-tainted-sql
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Request input reaches the SQL text of $DB.$Q() without a sanitizer. Pass it in the values
      array (db.query("SELECT ... WHERE id = ?", [id])).
    metadata:
      category: security
      bug-class: sql-injection
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
      safe-pattern: db.query("... WHERE id = ?", [id]).
      references:
        - https://node-postgres.com/features/queries#parameterized-query
    pattern-sources: *ts-request-sources
    pattern-sinks:
      - patterns:
          - pattern: $DB.$Q($SQL, ...)
          - metavariable-regex:
              metavariable: $Q
              regex: ^(query|execute|raw|run|all|get|prepare|exec|\$queryRawUnsafe|\$executeRawUnsafe)$
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(db|pool|client|conn|connection|knex|sequelize|prisma|database|sql)$
          - focus-metavariable: $SQL
    pattern-sanitizers: *ts-scalar-sanitizers

  - id: ts-weak-crypto
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      $ALG is broken for security use. Use sha256 for digests and aes-256-gcm for encryption; use
      crypto.randomBytes() or crypto.randomUUID() for tokens, never Math.random().
    metadata:
      category: security
      bug-class: weak-crypto
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
      safe-pattern: crypto.createHash("sha256"); crypto.createCipheriv("aes-256-gcm", key, iv).
      references:
        - https://nodejs.org/api/crypto.html
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $C.createHash($ALG, ...)
              - pattern: $C.createHmac($ALG, ...)
              - pattern: createHash($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^["'`](md4|md5|sha1|ripemd160)["'`]$
      - patterns:
          - pattern-either:
              - pattern: $C.createCipheriv($ALG, ...)
              - pattern: createCipheriv($ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^["'`](des|des-ede3?|des-ede3-cbc|des-cbc|rc4|rc2|bf|blowfish)[^"'`]*["'`]$|(?i)^["'`][^"'`]*-ecb["'`]$
      - patterns:
          - pattern-either:
              - pattern: const $NAME = <... Math.random() ...>;
              - pattern: let $NAME = <... Math.random() ...>;
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(token|secret|password|nonce|salt|apikey|api_key|sessionid).*
          - focus-metavariable: $NAME
